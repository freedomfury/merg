[project]
name = "merg"
version = "0.0.3"
description = "Deep merging for Python with strict JSON/YAML-shaped type validation."
authors = [{name = "Freedom Fury", email = "freedomfury@gmail.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    # Only versions CI actually exercises are claimed here. The package installs
    # and passes its suite on 3.10-3.12 as well (requires-python is the real
    # floor); add the classifier back per version as CI grows a matrix.
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/freedomfury/merg"
Repository = "https://github.com/freedomfury/merg"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["merg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Explicit select (not extend-select): the rule set is pinned here and by the
# ruff version in CI/Makefile, so lint can't drift red on a new ruff release.
select = ["E4", "E7", "E9", "F", "I", "SIM", "PIE"]
